    <style>
        :root {
            --primary: #fc2651;
            --primary-hover: #e91e47;
            --primary-light: rgba(252, 38, 81, 0.1);
            --primary-lighter: rgba(252, 38, 81, 0.05);
            --accent: #8b5cf6;
            --accent-light: rgba(139, 92, 246, 0.1);
            --success: #10b981;
            --warning: #f59e0b;
            --text: #1a1a1a;
            --text-muted: #6b7280;
            --text-light: #9ca3af;
            --bg: #ffffff;
            --bg-secondary: #f8fafc;
            --surface: #ffffff;
            --surface-hover: #f1f5f9;
            --border: #e2e8f0;
            --border-light: #f1f5f9;
            --glass: rgba(255, 255, 255, 0.8);
            --shadow-xs: 0 1px 2px 0 rgba(0, 0, 0 / 0.05);
            --shadow-sm: 0 1px 3px 0 rgba(0, 0, 0 / 0.1), 0 1px 2px -1px rgba(0, 0, 0 / 0.1);
            --shadow: 0 4px 6px -1px rgba(0, 0, 0 / 0.1), 0 2px 4px -2px rgba(0, 0, 0 / 0.1);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0 / 0.1), 0 4px 6px -4px rgba(0, 0, 0 / 0.1);
            --shadow-xl: 0 20px 25px -5px rgba(0, 0, 0 / 0.1), 0 8px 10px -6px rgba(0, 0, 0 / 0.1);
            --shadow-glow: 0 0 20px rgba(252, 38, 81, 0.3);
            --radius: 12px;
            --radius-sm: 8px;
            --radius-lg: 16px;
            --radius-xl: 20px;
            --gradient-primary: linear-gradient(135deg, #fc2651 0%, #e91e47 100%);
            --gradient-accent: linear-gradient(135deg, #8b5cf6 0%, #7c3aed 100%);
            --gradient-surface: linear-gradient(135deg, #ffffff 0%, #f8fafc 100%);
        }

        .dark-mode {
            --primary: #fc2651;
            --primary-hover: #ff4d75;
            --primary-light: rgba(252, 38, 81, 0.15);
            --primary-lighter: rgba(252, 38, 81, 0.08);
            --accent: #a855f7;
            --accent-light: rgba(168, 85, 247, 0.15);
            --success: #34d399;
            --warning: #fbbf24;
            --text: #f1f5f9;
            --text-muted: #94a3b8;
            --text-light: #64748b;
            --bg: #0f172a;
            --bg-secondary: #1e293b;
            --surface: #1e293b;
            --surface-hover: #334155;
            --border: #334155;
            --border-light: #475569;
            --glass: rgba(30, 41, 59, 0.8);
            --shadow-xs: 0 1px 2px 0 rgba(0, 0, 0 / 0.4);
            --shadow-sm: 0 1px 3px 0 rgba(0, 0, 0 / 0.5), 0 1px 2px -1px rgba(0, 0, 0 / 0.5);
            --shadow: 0 4px 6px -1px rgba(0, 0, 0 / 0.5), 0 2px 4px -2px rgba(0, 0, 0 / 0.5);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0 / 0.6), 0 4px 6px -4px rgba(0, 0, 0 / 0.6);
            --shadow-xl: 0 20px 25px -5px rgba(0, 0, 0 / 0.7), 0 8px 10px -6px rgba(0, 0, 0 / 0.7);
            --shadow-glow: 0 0 20px rgba(252, 38, 81, 0.4);
            --gradient-primary: linear-gradient(135deg, #fc2651 0%, #ff4d75 100%);
            --gradient-accent: linear-gradient(135deg, #a855f7 0%, #9333ea 100%);
            --gradient-surface: linear-gradient(135deg, #1e293b 0%, #334155 100%);
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', system-ui, sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 0;
            background: var(--bg);
            color: var(--text);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-weight: 400;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        header {
            background: var(--gradient-primary);
            color: white;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: var(--shadow-lg);
            backdrop-filter: blur(20px);
        }

        .header-content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 1.25rem 1rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1.5rem;
        }

        .logo {
            font-size: 1.75rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, #ffffff 0%, rgba(255, 255, 255, 0.8) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .search-container {
            display: flex;
            flex: 1;
            max-width: 500px;
            gap: 0.75rem;
        }

        #searchBar {
            flex: 1;
            padding: 0.875rem 1rem;
            border: 0;
            border-radius: var(--radius);
            background: var(--glass);
            backdrop-filter: blur(20px);
            color: var(--text);
            font-size: 15px;
            outline: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: var(--shadow-sm);
        }

        #searchBar:focus {
            background: var(--text);
            box-shadow: 0 0 0 3px rgba(252, 38, 81, 0.25), var(--shadow);
            transform: translateY(-1px);
            color: var(--glass);
        }

        #searchBar::placeholder {
            color: var(--text-muted);
        }

        #sortOptions, #filterOptions {
            padding: 0.875rem 1rem;
            border: 0;
            border-radius: var(--radius);
            background: var(--glass);
            backdrop-filter: blur(20px);
            color: var(--text-muted);
            font-size: 15px;
            cursor: pointer;
            outline: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            min-width: 130px;
            box-shadow: var(--shadow-sm);
        }

        #sortOptions:hover, #filterOptions:hover {
            background: var(--text);
            transform: translateY(-1px);
            box-shadow: var(--shadow);
            color: var(--glass);
        }

        .control-buttons {
            display: flex;
            gap: 0.5rem;
        }

        main {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem 1rem;
            padding-bottom: 6rem;
        }

        #zoneCount {
            margin: 0 0 1.5rem;
            font-size: 14px;
            color: var(--text-muted);
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        #zoneCount::before {
            content: '';
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: var(--primary);
        }

        #container, #featuredZones {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 1.5rem;
        }

        .zone-item {
            background: var(--gradient-surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            overflow: hidden;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: var(--shadow-sm);
        }

        .zone-item:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: var(--shadow-xl);
            border-color: var(--primary);
        }

        .zone-item:hover::before {
            opacity: 1;
        }

        .zone-item::before {
            content: '';
            position: absolute;
            inset: 0;
            background: var(--primary-light);
            opacity: 0;
            transition: opacity 0.4s ease;
            pointer-events: none;
            z-index: 1;
        }

        .zone-item img {
            width: 100%;
            aspect-ratio: 1;
            object-fit: cover;
            display: block;
            background: var(--border-light);
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .zone-item:hover img {
            transform: scale(1.05);
        }

        .zone-item button {
            background: transparent;
            color: var(--text);
            border: 0;
            padding: 1.25rem 1rem;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            line-height: 1.4;
            text-align: center;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            min-height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            z-index: 2;
        }

        .zone-item:hover button {
            color: var(--primary);
            background: rgba(252, 38, 81, 0.05);
        }

        footer {
            background: var(--bg-secondary);
            border-top: 1px solid var(--border);
            padding: 1rem;
            text-align: center;
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            z-index: 100;
        }

        .footer-links {
            display: flex;
            justify-content: center;
            gap: 2rem;
            flex-wrap: wrap;
        }

        .footer-links a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            padding: 0.5rem 1rem;
            border-radius: var(--radius);
        }

        .footer-links a:hover {
            color: var(--primary-hover);
            background: var(--primary-light);
            transform: translateY(-1px);
        }
    </style>

</head>
<body class="dark-mode">

    <header>
        <div class="header-content">
            <div class="logo">gn-math</div>
            <div class="search-container">
                <input type="text" id="searchBar" placeholder="Search zones..." oninput="filterZones()">
                <select id="sortOptions" onchange="sortZones()">
                    <option value="name">Name</option>
                    <option value="id">ID (Date)</option>
                    <option value="popular">Popular</option>
                    <option value="trendingDay">Trending (Day)</option>
                    <option value="trendingWeek">Trending (Week)</option>
                    <option value="trendingMonth">Trending (Month)</option>
                </select>
                <select id="filterOptions" onchange="filterZones2()">
                    <option value="none">(SELECT TAG)</option>
                </select>
            </div>
            <div class="control-buttons">
                <button id="refresh" class="control-button" title="Refresh all the zones" onclick="listZones()">
                    <img src="refresh-icon.png" alt="refresh">
                </button>
                <button id="settings" class="control-button" title="Settings!">
                    <img src="setting.png" alt="settings">
                </button>
            </div>
        </div>
    </header>

    <main>
        <details id="featuredZonesWrapper" open>
            <summary id="allZonesSummary" style="font-size: 1.2rem; font-weight: bold; cursor: pointer;">Featured Zones</summary>
            <div id="featuredZones" class="zone-container"></div>
        </details>
        <br><hr><br>
        <details id="allZonesWrapper" open>
            <summary id="allSummary" style="font-size: 1.2rem; font-weight: bold; cursor: pointer;">All Zones</summary>
            <div id="container">Loading...</div>
        </details>
    </main>

    <footer>
        <div class="footer-links">
            <a href="#" onclick="loadDMCA(); return false;">DMCA</a>
            <a href="#" onclick="showContact(); return false;">Contact</a>
            <a href="#" onclick="loadPrivacy(); return false;">Privacy Policy</a>
            <a href="javascript:saveData()">Export Data</a>
            <a href="#" onclick="document.getElementById('importData').click(); return false;">Import Data</a>
            <input type="file" id="importData" style="display: none;" onchange="loadData(event)">
        </div>
    </footer>

</body>
